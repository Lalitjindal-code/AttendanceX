name: Flutter CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
        
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        
      - name: Run Tests (Unit & Widget)
        # We run goldens on linux and we pinned the flutter version above
        run: flutter test --update-goldens
        
  build:
    name: Build APK & AppBundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        
      # Build APK
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: attendancex-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Build AppBundle
      - name: Build AppBundle
        run: flutter build appbundle --release
        
      - name: Upload AppBundle
        uses: actions/upload-artifact@v4
        with:
          name: attendancex-aab
          path: build/app/outputs/bundle/release/app-release.aab
          
  build_ios:
    name: Build iOS (No Codesign)
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        
      # Build iOS without signing (for testing compilation on cloud)
      - name: Build iOS
        run: flutter build ios --release --no-codesign

        


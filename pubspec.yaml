name: attendify
description: A premium offline-first attendance tracker for college students.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Local Database ───────────────────────────────────────────────────────────
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1   # Provides native Isar binary for Android/iOS

  # ── Preferences ──────────────────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── Charts (Phase 5) ─────────────────────────────────────────────────────────
  fl_chart: ^0.68.0

  # ── Calendar Widget (Phase 6) ─────────────────────────────────────────────────
  table_calendar: ^3.1.2

  # ── Notifications (Phase 7) ──────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.2

  # ── Internationalisation / Formatting ────────────────────────────────────────
  intl: ^0.20.3

  # ── Unique IDs ────────────────────────────────────────────────────────────────
  uuid: ^4.4.2

  # ── File System ──────────────────────────────────────────────────────────────
  path_provider: ^2.1.4

  # ── File Picker — Backup Import (Phase 8) ────────────────────────────────────
  file_picker: ^8.1.2

  # ── Share / Export (Phase 8) ─────────────────────────────────────────────────
  share_plus: ^10.0.2

  # ── Typography ───────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  rxdart: ^0.27.7
  collection: ^1.19.1
  timezone: ^0.9.4
  crypto: ^3.0.7
  shimmer: ^3.0.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^6.2.1
  flutter_animate: ^4.5.2
  local_auth: ^3.0.2

  # ── Home Screen Widget ───────────────────────────────────────────────────────
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  mocktail: ^1.0.3

  # ── Code Generation ───────────────────────────────────────────────────────────
  build_runner: ^2.4.12
  isar_generator: ^3.1.0+1
  riverpod_generator: any

  # ── Linting ───────────────────────────────────────────────────────────────────
  custom_lint: any
  riverpod_lint: any
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
